name: Windows release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # Keyless Sigstore signing: cosign exchanges this OIDC token for a short-lived
  # Fulcio certificate, so there is no long-lived key or secret to leak.
  id-token: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm 11 can skip dependency install scripts, which would leave Electron without its binary.
      - name: Ensure Electron binary
        shell: pwsh
        run: |
          if (-not (Test-Path "node_modules/electron/dist/electron.exe")) {
            node node_modules/electron/install.js
          }

      # Downloads the Windows llama.cpp runtime and proves it loads before packaging.
      - name: Verify llama.cpp runtime
        run: npm run preflight

      # electron-builder signs automatically when CSC_LINK holds a base64 .pfx and
      # CSC_KEY_PASSWORD holds its password. Without those secrets the build is
      # unsigned, which is why Windows shows the SmartScreen prompt for it.
      - name: Build installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          npm run dist 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { throw "electron-builder exited with $LASTEXITCODE" }

      # A build that was supposed to be signed must not ship silently unsigned.
      - uses: sigstore/cosign-installer@v3

      # This is a detached, transparency-logged signature over the exact bytes of
      # the installer. It proves who built it and that it was not altered. It is
      # NOT Authenticode, so it does not clear SmartScreen — see the README.
      - name: Sign installer with Sigstore
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist/Blackbox-*-win-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer was not produced." }
          cosign sign-blob --yes --bundle "$($installer.FullName).sigstore.json" $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "cosign sign-blob failed with $LASTEXITCODE" }

      # A bundle nobody verified is decoration: fail the release if it is wrong.
      - name: Verify the Sigstore bundle
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist/Blackbox-*-win-x64.exe" | Select-Object -First 1
          cosign verify-blob `
            --bundle "$($installer.FullName).sigstore.json" `
            --certificate-identity-regexp "^https://github.com/itriedcoding/locally-uncensored-ai/.github/workflows/windows-release.yml@.*$" `
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" `
            $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "Sigstore verification failed with $LASTEXITCODE" }

      - name: Verify installer signature
        shell: pwsh
        env:
          SIGNING_EXPECTED: ${{ secrets.CSC_LINK != '' }}
        run: |
          $installer = Get-ChildItem "dist/Blackbox-*-win-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer was not produced." }
          $signature = Get-AuthenticodeSignature $installer.FullName
          Write-Host "Authenticode status: $($signature.Status)"
          if ($signature.SignerCertificate) { Write-Host "Signer: $($signature.SignerCertificate.Subject)" }
          if ($env:SIGNING_EXPECTED -eq "true") {
            if ($signature.Status -ne "Valid") { throw "CSC_LINK is configured but the installer signature is $($signature.Status)." }
            Write-Host "::notice title=signed::Installer signature is valid."
          } else {
            Write-Host "::warning title=unsigned::No CSC_LINK secret is configured, so this installer is unsigned and Windows SmartScreen will warn."
          }

      # Job logs are only readable when signed in. Annotations are rendered on the public
      # run page, so surface the tail of the build log there when packaging fails.
      - name: Report build failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build.log) { $text = Get-Content build.log -Raw } else { $text = "build.log was not created" }
          $text = $text -replace "%", "%25" -replace "`r", "" -replace "`n", "%0A"
          $size = 3000
          $count = [Math]::Min(10, [Math]::Ceiling($text.Length / $size))
          for ($i = 0; $i -lt $count; $i++) {
            $start = $i * $size
            if ($start -ge $text.Length) { break }
            $len = [Math]::Min($size, $text.Length - $start)
            Write-Host "::error title=buildlog$i::$($text.Substring($start, $len))"
          }
          Write-Host "::warning title=buildlog-tail::log length $($text.Length) chars"

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: blackbox-windows-x64
          path: |
            dist/Blackbox-*-win-x64.exe
            dist/Blackbox-*-win-x64.exe.sigstore.json
          if-no-files-found: error

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $installer = Get-ChildItem "dist/Blackbox-*-win-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer was not produced." }
          $bundle = "$($installer.FullName).sigstore.json"
          if (-not (Test-Path $bundle)) { throw "Sigstore bundle was not produced." }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $installer.FullName $bundle --title "Blackbox $tag" --generate-notes --latest
          } else {
            gh release upload $tag $installer.FullName $bundle --clobber
          }
