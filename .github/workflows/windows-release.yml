name: Windows release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm 11 can skip dependency install scripts, which would leave Electron without its binary.
      - name: Ensure Electron binary
        shell: pwsh
        run: |
          if (-not (Test-Path "node_modules/electron/dist/electron.exe")) {
            node node_modules/electron/install.js
          }

      # Downloads the Windows llama.cpp runtime and proves it loads before packaging.
      - name: Verify llama.cpp runtime
        run: npm run preflight

      - name: Build installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run dist 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { throw "electron-builder exited with $LASTEXITCODE" }

      # If packaging fails, put the build log back in the repo: job logs need a signed-in
      # viewer, and this makes the failure diagnosable from a plain clone.
      - name: Record build failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build.log) { $lines = Get-Content build.log -Tail 500 } else { $lines = @("build.log was not created") }
          $body = "# CI build failure" + "`n`n" + "Run: " + "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" + "`n`n```" + "`n" + ($lines -join "`n") + "`n```"
          Set-Content -Path ci-failure.log -Value $body
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-failure.log
          git commit -m "Record Windows build failure [skip ci]"
          git push origin HEAD:main

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: blackbox-windows-x64
          path: dist/Blackbox-*-win-x64.exe
          if-no-files-found: error

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $installer = Get-ChildItem "dist/Blackbox-*-win-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer was not produced." }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $installer.FullName --title "Blackbox $tag" --generate-notes --latest
          } else {
            gh release upload $tag $installer.FullName --clobber
          }
