<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Blackbox</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="titlebar">
        <div class="titlebar__drag">
          <div class="brand">
            <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
              <rect x="2.5" y="2.5" width="27" height="27" rx="8.5" fill="none" stroke="currentColor" stroke-width="2" />
              <circle cx="16" cy="16" r="5.5" fill="none" stroke="currentColor" stroke-width="2" />
              <circle cx="16" cy="16" r="1.6" fill="currentColor" />
            </svg>
            <span class="brand__name">BLACKBOX</span>
            <span class="brand__tag">local · uncensored</span>
          </div>
          <div class="titlebar__status" id="titlebar-status"></div>
        </div>
        <div class="titlebar__controls">
          <button class="winbtn" data-win="minimize" aria-label="Minimize" title="Minimize">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" stroke="currentColor" stroke-width="1.2" /></svg>
          </button>
          <button class="winbtn" data-win="maximize" aria-label="Maximize" title="Maximize">
            <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2.6" y="2.6" width="6.8" height="6.8" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.2" /></svg>
          </button>
          <button class="winbtn winbtn--close" data-win="close" aria-label="Close" title="Close">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.2" /></svg>
          </button>
        </div>
      </header>

      <div class="workspace">
        <aside class="rail">
          <div class="rail__top">
            <button class="btn btn--primary btn--block" data-action="new-chat">
              <svg viewBox="0 0 16 16" class="ico" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" /></svg>
              New chat
            </button>
          </div>

          <div class="rail__section">
            <div class="rail__label">Conversations</div>
            <div class="chat-list" id="chat-list"></div>
          </div>

          <div class="rail__bottom">
            <button class="model-card" id="rail-model" data-action="view" data-view="models">
              <div class="model-card__top">
                <span class="status-dot" id="rail-model-dot"></span>
                <span class="model-card__label">Model</span>
              </div>
              <div class="model-card__name" id="rail-model-name">None loaded</div>
              <div class="model-card__meta" id="rail-model-meta">Choose a model to begin</div>
            </button>

            <div class="rail__actions">
              <button class="ghost-btn" data-action="view" data-view="models" id="nav-models">
                <svg viewBox="0 0 16 16" class="ico" aria-hidden="true"><path d="M2.5 5.5h11M2.5 10.5h11M5.5 2.5v11M10.5 2.5v11" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" /></svg>
                Models
              </button>
              <button class="ghost-btn" data-action="view" data-view="settings" id="nav-settings">
                <svg viewBox="0 0 16 16" class="ico" aria-hidden="true">
                  <circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.2" />
                  <path d="M8 1.8v1.7M8 12.5v1.7M1.8 8h1.7M12.5 8h1.7M3.6 3.6l1.2 1.2M11.2 11.2l1.2 1.2M12.4 3.6l-1.2 1.2M4.8 11.2l-1.2 1.2" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" />
                </svg>
                Settings
              </button>
              <button class="ghost-btn" data-action="view" data-view="publish" id="nav-publish">
                <svg viewBox="0 0 16 16" class="ico" aria-hidden="true"><path d="M8 2.5v8M4.6 7.1L8 10.5l3.4-3.4M2.8 12.6h10.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
                Publish
              </button>
              <button class="ghost-btn" data-action="view" data-view="train" id="nav-train">
                <svg viewBox="0 0 16 16" class="ico" aria-hidden="true"><path d="M2.6 11.8l3.1-3.1 2.4 2.4 5.3-5.9" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M9.9 5.2h3.6v3.6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" /></svg>
                Fine-tune
              </button>
              <button class="ghost-btn" data-action="view" data-view="api" id="nav-api">
                <svg viewBox="0 0 16 16" class="ico" aria-hidden="true"><path d="M6.2 4.2L3 8l3.2 3.8M9.8 4.2L13 8l-3.2 3.8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
                API
              </button>
            </div>

            <div class="memory">
              <div class="memory__row">
                <span>System memory</span>
                <span class="mono" id="memory-readout">—</span>
              </div>
              <div class="memory__bar"><div class="memory__fill" id="memory-fill"></div></div>
            </div>
          </div>
        </aside>

        <main class="stage">
          <section class="view" id="view-chat" data-view-panel="chat">
            <div class="chat-head">
              <div class="chat-head__left">
                <h1 class="chat-title" id="chat-title">New conversation</h1>
                <div class="chat-sub" id="chat-sub">Nothing runs until you pick a model.</div>
              </div>
              <div class="chat-head__right">
                <button class="icon-btn" data-action="open-sampling" title="Sampling settings" aria-label="Sampling settings">
                  <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5h11M2.5 11h11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" /><circle cx="6" cy="5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.2" /><circle cx="10.5" cy="11" r="1.6" fill="none" stroke="currentColor" stroke-width="1.2" /></svg>
                </button>
                <button class="icon-btn" data-action="clear-chat" title="Clear conversation" aria-label="Clear conversation">
                  <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 4.5h9M6.5 4.5V3h3v1.5M5 4.5l.6 8.2h4.8L11 4.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" /></svg>
                </button>
              </div>
            </div>

            <div class="messages" id="messages"></div>

            <div class="composer-wrap">
              <div class="composer glass" id="composer-box">
                <textarea id="composer" rows="1" placeholder="Ask anything. Nothing leaves this machine." spellcheck="false"></textarea>
                <div class="composer__bar">
                  <button class="chip chip--model" id="composer-model" data-action="view" data-view="models">
                    <span class="status-dot status-dot--sm" id="composer-dot"></span>
                    <span id="composer-model-name">No model</span>
                  </button>
                  <div class="composer__spacer"></div>
                  <span class="composer__hint" id="composer-hint">Enter to send · Shift+Enter for a new line</span>
                  <button class="icon-btn" data-action="open-sampling" title="Sampling settings" aria-label="Sampling settings">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5h11M2.5 11h11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" /><circle cx="6" cy="5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.2" /><circle cx="10.5" cy="11" r="1.6" fill="none" stroke="currentColor" stroke-width="1.2" /></svg>
                  </button>
                  <button class="send-btn" id="send-btn" data-action="send" title="Send" aria-label="Send">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 12.5V4M4.2 7.6L8 3.8l3.8 3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
                  </button>
                  <button class="send-btn send-btn--stop hidden" id="stop-btn" data-action="stop" title="Stop" aria-label="Stop">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="5" width="6" height="6" rx="1.2" fill="currentColor" /></svg>
                  </button>
                </div>
              </div>
              <div class="composer-foot" id="composer-foot">Runs entirely on your CPU. No account, no telemetry, no filters.</div>
            </div>
          </section>

          <section class="view hidden" id="view-models" data-view-panel="models"></section>
          <section class="view hidden" id="view-settings" data-view-panel="settings"></section>
          <section class="view hidden" id="view-publish" data-view-panel="publish"></section>
          <section class="view hidden" id="view-train" data-view-panel="train"></section>
          <section class="view hidden" id="view-api" data-view-panel="api"></section>
        </main>
      </div>
    </div>

    <div class="modal-root" id="modal-root"></div>
    <div class="toasts" id="toasts"></div>

    <script src="markdown.js" defer></script>
    <script src="studio.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
